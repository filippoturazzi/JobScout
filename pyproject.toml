[project]
name = "jobscout"
version = "0.1.0"
description = "Open-source AI agent that continuously finds tech jobs matching your profile."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Filippo Turazzi" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
jobscout = "jobscout.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscout"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits real external services; deselected by default",
]
addopts = "-m 'not integration'"
filterwarnings = [
    # Third-party deprecations raised by starlette's TestClient at import time (starlette 1.x).
    "ignore:Using .httpx. with .starlette\\.testclient. is deprecated:",
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:",
]
