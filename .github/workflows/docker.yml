name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The example file on purpose: its DATABASE_URL says SQLite, and compose must override it.
      - name: Write .env
        run: |
          grep -v '^POSTGRES_PASSWORD=' .env.example > .env
          printf 'POSTGRES_PASSWORD=ci-smoke\nTZ=America/Sao_Paulo\n' >> .env
      - name: Compose smoke test
        run: bash scripts/compose_smoke.sh
        env:
          EXPECTED_TZ_OFFSET: "-0300"
          SMOKE_CLEANUP: "1"

  publish:
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/filippoturazzi/jobscout
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
